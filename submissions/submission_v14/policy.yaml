# v14 knobs: full-gradient MSE + temporal-difference adaptation (no intervals).
# Resolution for base_model: this file > BASE_MODEL env > default "cno".
# Needed because the staged checkpoint is renamed to model.pth,
# which carries no architecture hint for load_baseline.
base_model: fno
# Full-parameter optimizer learning rate (every ttt_step with a revealed pair).
ttt_lr: 0.0005
# Inner gradient steps per ttt_step ("full update" vs v9/v10's single step).
ttt_steps: 1
# Optimizer on all weights: sgd | adam.
optimizer: adam
# Weight of the temporal-difference matching term:
# loss = MSE(pred, tgt) + td_lambda * MSE(diff(pred), diff(tgt)).
td_lambda: 1
# Global grad-norm clip (0 disables).
grad_clip: 0
