# v5 knobs: base-model hint + relative-calibration table settings.
# Resolution for base_model: this file > BASE_MODEL env > default "cno".
# Needed because the staged checkpoint is renamed to model.pth,
# which carries no architecture hint for load_baseline.
base_model: cno
# Relative-residual quantile level: nominal per-step coverage of the table.
coverage: 0.90
# Previous (pred, target) windows kept in the residual table.
history: 5
# First T time-frames of each window kept in the table (T=20, default 5).
table_frames: 5
# Relative half-width used when the residual table is empty (trajectory start)
# so bounds are returned on every step. 0.05 mirrors the scorer's default band.
fallback_frac: 0.05
